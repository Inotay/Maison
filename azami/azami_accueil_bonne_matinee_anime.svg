<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bonne matinée" data-scene="accueil_bonne_matinee" data-theme-agnostic="true" data-background="transparent" data-duration="14.6">
      <title>Accueil · Bonne matinée</title><g id="micro-accents"><g id="spark-a"><path d="M120 276 Q121 284 129 285 Q121 286 120 294 Q119 286 111 285 Q119 284 120 276Z" fill="#F2BC42"/></g><g id="spark-b"><path d="M391 315 Q392 323 400 324 Q392 325 391 333 Q390 325 382 324 Q390 323 391 315Z" fill="#FFF5DD"/></g></g><style><![CDATA[:root{--scene-duration:14.6s;}

/* AZAMI V3 — MOTION SYSTEM. 100 % VECTOR, CSS KEYFRAMES, NO DEPENDENCIES. */
#cat-rig,#head-rig,#body-rig,#tail,#ear-left,#ear-right,#arm-left,#arm-right,
#scene-prop,#extra-prop,#basket-rig,#fish-pop,#broom-rig,#coin-rig,#coin-sparkles,
#envelope-rig,#heart-rig,#fish-rig,#stars-rig,#spark-pop,#motion-arcs,
#decor-sparkle-1,#decor-sparkle-2,#meow-mouth,#smile,#eyes-open,#eyes-sleepy,
#spark-a,#spark-b,#spark-c,#confetti,#clean-sparkles,#ear-twinkle,#cheek-blush,
#nose,#whiskers { transform-box:view-box; }
#cat-rig { transform-origin:256px 353px; animation:cat-action var(--scene-duration) cubic-bezier(.35,.0,.25,1) infinite; }
#head-rig { transform-origin:256px 246px; animation:head-action var(--scene-duration) cubic-bezier(.45,0,.25,1) infinite; }
#body-rig { transform-origin:256px 353px; animation:breath 4.9s ease-in-out infinite; }
#tail { transform-origin:321px 340px; animation:tail-idle 4.3s ease-in-out infinite; }
#ear-left { transform-origin:178px 145px; animation:ear-left-idle 5.6s ease-in-out infinite; }
#ear-right { transform-origin:333px 145px; animation:ear-right-idle 7.3s ease-in-out infinite; }
#arm-left { transform-origin:205px 308px; animation:paw-l var(--scene-duration) ease-in-out infinite; }
#arm-right { transform-origin:303px 308px; animation:paw-r var(--scene-duration) ease-in-out infinite; }
#eyes-open { animation:eyes-open-anim 6.85s steps(1,end) infinite; }
#eyes-sleepy { animation:eyes-close-anim 6.85s steps(1,end) infinite; }
#smile { animation:smile-action var(--scene-duration) steps(1,end) infinite; }
#meow-mouth { animation:mouth-action var(--scene-duration) steps(1,end) infinite; }
#cheek-blush { animation:blush 8.2s ease-in-out infinite; }
#nose { transform-origin:256px 228px; animation:nose 5.6s ease-in-out infinite; }
#whiskers {transform-origin:256px 232px; animation:whiskers 6.9s ease-in-out infinite;}
#motion-arcs {animation:surprise var(--scene-duration) steps(1,end) infinite;}
#spark-pop {animation:surprise var(--scene-duration) steps(1,end) infinite;}
#spark-a {animation:independent-sparkle 3.7s ease-in-out infinite;}
#spark-b {animation:independent-sparkle 5.3s ease-in-out -1.7s infinite;}
#spark-c {animation:independent-sparkle 4.9s ease-in-out -3.2s infinite;}
@keyframes breath {0%,100%{transform:scale(1,1);} 46%{transform:translateY(2px) scale(1.015,.982);} }
@keyframes tail-idle {0%,11%,100%{transform:rotate(0deg)} 19%{transform:rotate(17deg)} 26%{transform:rotate(-7deg)} 34%{transform:rotate(8deg)} 45%,72%{transform:rotate(0deg)} 81%{transform:rotate(-14deg)} 91%{transform:rotate(3deg)}}
@keyframes ear-left-idle {0%,38%,100%{transform:rotate(0deg)} 39%{transform:rotate(-13deg)} 43%{transform:rotate(5deg)} 47%{transform:rotate(0deg)} 81%{transform:rotate(-5deg)} 85%{transform:rotate(0deg)}}
@keyframes ear-right-idle {0%,17%,100%{transform:rotate(0deg)} 19%{transform:rotate(10deg)} 23%{transform:rotate(-5deg)} 27%{transform:rotate(0deg)} 71%{transform:rotate(7deg)} 75%{transform:rotate(0deg)}}
@keyframes eyes-open-anim {0%,15%,17.3%,39%,40.7%,75%,77.4%,100%{opacity:1;} 15.2%,17%,39.2%,40.5%,75.2%,77.1%{opacity:0;}}
@keyframes eyes-close-anim {0%,15%,17.3%,39%,40.7%,75%,77.4%,100%{opacity:0;} 15.2%,17%,39.2%,40.5%,75.2%,77.1%{opacity:1;}}
@keyframes nose {0%,28%,64%,100%{transform:translateY(0)}29%{transform:translateY(1.6px)}32%{transform:translateY(0)}65%{transform:translateY(2px)}67%{transform:translateY(-1px)}70%{transform:translateY(0)}}
@keyframes whiskers {0%,22%,100%{transform:translateX(0)}24%{transform:translateX(-2px)}27%{transform:translateX(1px)}30%{transform:translateX(0)}80%{transform:translateX(2px)}84%{transform:translateX(0)}}
@keyframes blush {0%,45%,70%,100%{opacity:.38}53%,62%{opacity:.72}}
@keyframes independent-sparkle {0%,100%{opacity:.16;transform:scale(.76)}43%{opacity:.92;transform:scale(1.11)}70%{opacity:.35;transform:scale(.91)}}
@keyframes smile-action {0%,21%,27%,66%,75%,100%{opacity:1}22%,26%,67%,74%{opacity:0}}
@keyframes mouth-action {0%,21%,27%,66%,75%,100%{opacity:0}22%,26%,67%,74%{opacity:1}}
@keyframes surprise {0%,17%,33%,64%,80%,100%{opacity:0}19%,26%,68%,75%{opacity:1}}
@keyframes paw-l {0%,13%,44%,100%{transform:rotate(0deg)}17%{transform:rotate(-17deg)}26%{transform:rotate(12deg)}32%{transform:rotate(0deg)}}
@keyframes paw-r {0%,24%,56%,100%{transform:rotate(0deg)}29%{transform:rotate(16deg)}36%{transform:rotate(-18deg)}43%{transform:rotate(8deg)}49%{transform:rotate(0deg)}}
@keyframes cat-action {0%,100%{transform:translate(0,0) scale(1)} }
@keyframes head-action {0%,100%{transform:rotate(0deg)} }
/* Force reduced motion respected even when app embeds SVG as an image. */
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

@keyframes cat-action {0%,18%,100%{transform:translate(0,0) scale(1)} 23%{transform:translateX(7px) rotate(4deg)} 26%{transform:translateX(2px) scale(1.05,.95)} 30%{transform:translate(28px,-25px) rotate(13deg)} 33%{transform:translate(36px,-47px) rotate(-9deg)} 37%{transform:translate(3px,4px) scale(1.1,.87)} 42%{transform:translate(0,0)} 76%{transform:translateY(-11px)} 80%{transform:translate(0,2px) scale(1.04,.96)} 84%{transform:translate(0,0)}}
@keyframes head-action {0%,13%,100%{transform:rotate(0deg)} 19%{transform:rotate(14deg)} 24%{transform:rotate(21deg)} 29%{transform:rotate(-14deg)} 38%{transform:rotate(9deg)} 44%{transform:rotate(0deg)} 78%{transform:rotate(-10deg)} 85%{transform:rotate(0deg)}}
#extra-prop{transform-origin:376px 210px;animation:feather var(--scene-duration) ease-in-out infinite;} @keyframes feather{0%,10%,100%{transform:rotate(0deg)} 19%{transform:rotate(12deg)} 26%{transform:rotate(-18deg)} 33%{transform:rotate(27deg)} 40%{transform:rotate(-25deg)} 48%{transform:rotate(6deg)} 64%{transform:rotate(0deg)} 77%{transform:rotate(-13deg)} 85%{transform:rotate(0deg)}}]]></style><desc>Une plume attire Azami ; elle l’observe, bondit et essaie de l’attraper Boucle dynamique de 14.6 secondes.</desc>
