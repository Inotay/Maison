<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
 role="img" aria-label="Azami V4 — jeu" data-scene="jeu" data-animated="true"
 data-duration="12.4" data-background="transparent" data-audio="none">
<title>Azami V4 — jeu</title><desc>Azami se tapit, bondit rapidement vers une balle, atterrit puis l’observe.</desc>
<style><![CDATA[
    :root { --D: 14.8s; }
    #sit-rig,#quad-rig,#sit-tail,#quad-tail,#sit-head,#quad-head,
    #sit-ear-left,#sit-ear-right,#quad-ear-left,#quad-ear-right,
    #sit-arm-near,#sit-arm-far,#q-leg-front-near,#q-leg-front-far,
    #q-leg-rear-near,#q-leg-rear-far,#sit-tongue,#sit-mouth-open,
    #sit-mouth-smile,#quad-mouth-open,#quad-smile,#ball,#stars,#groom-tongue-front,
    #sit-eyes-open,#sit-eyes-shut,#quad-eyes-open,#quad-eyes-shut {
      transform-box:view-box;
    }
    #sit-rig { transform-origin:256px 400px; }
    #quad-rig { transform-origin:256px 380px; }
    #sit-head { transform-origin:256px 254px; animation: sit-look 6.4s ease-in-out infinite; }
    #quad-head { transform-origin:171px 248px; animation: quad-look 5.6s ease-in-out infinite; }
    #sit-tail { transform-origin:324px 342px; animation:sit-tail 4.8s ease-in-out infinite; }
    #quad-tail { transform-origin:324px 303px; animation:quad-tail 3.7s ease-in-out infinite; }
    #sit-ear-left { transform-origin:204px 154px; animation:ear-left 7.2s ease-in-out infinite; }
    #sit-ear-right { transform-origin:312px 154px; animation:ear-right 6.3s ease-in-out infinite; }
    #quad-ear-left { transform-origin:116px 173px; animation:ear-left 7.3s ease-in-out infinite; }
    #quad-ear-right { transform-origin:202px 166px; animation:ear-right 5.6s ease-in-out infinite; }
    #sit-eyes-open,#quad-eyes-open { animation:blinks-open 7.7s step-end infinite; }
    #sit-eyes-shut,#quad-eyes-shut { animation:blinks-shut 7.7s step-end infinite; }
    @keyframes blinks-open {0%,22%,24%,56%,58%,89%,91%,100%{opacity:1}22.5%,23.6%,56.5%,57.6%,89.5%,90.6%{opacity:0}}
    @keyframes blinks-shut {0%,22%,24%,56%,58%,89%,91%,100%{opacity:0}22.5%,23.6%,56.5%,57.6%,89.5%,90.6%{opacity:1}}
    @keyframes sit-look {0%,12%,100%{transform:rotate(0)}24%{transform:rotate(-6deg)}33%{transform:rotate(5deg)}40%,68%{transform:rotate(0deg)}73%{transform:rotate(9deg)}84%{transform:rotate(0deg)}}
    @keyframes quad-look {0%,8%,100%{transform:rotate(0deg)}18%{transform:rotate(-5deg)}28%{transform:rotate(6deg)}46%,64%{transform:rotate(0deg)}74%{transform:rotate(-7deg)}85%{transform:rotate(0deg)}}
    @keyframes sit-tail {0%,8%,40%,100%{transform:rotate(0deg)}18%{transform:rotate(-12deg)}28%{transform:rotate(9deg)}52%{transform:rotate(-7deg)}59%{transform:rotate(4deg)}70%{transform:rotate(0deg)}}
    @keyframes quad-tail {0%,8%,100%{transform:rotate(0deg)}19%{transform:rotate(14deg)}28%{transform:rotate(-9deg)}41%{transform:rotate(7deg)}57%{transform:rotate(-12deg)}76%{transform:rotate(0deg)}}
    @keyframes ear-left {0%,21%,100%{transform:rotate(0)}23%{transform:rotate(-12deg)}26%{transform:rotate(4deg)}30%{transform:rotate(0)}65%{transform:rotate(-5deg)}69%{transform:rotate(0)}}
    @keyframes ear-right {0%,53%,100%{transform:rotate(0)}55%{transform:rotate(11deg)}59%{transform:rotate(-4deg)}63%{transform:rotate(0)}}
    #sit-arm-far { transform-origin:299px 302px;animation:arm-far-idle 5s ease-in-out infinite; }
    #sit-arm-near { transform-origin:213px 299px;animation:arm-near-idle 5.4s ease-in-out infinite; }
    @keyframes arm-far-idle {0%,82%,100%{transform:rotate(0deg)}88%{transform:rotate(6deg)}95%{transform:rotate(0deg)}}
    @keyframes arm-near-idle {0%,80%,100%{transform:rotate(0deg)}85%{transform:rotate(-5deg)}90%{transform:rotate(2deg)}}
    @media (prefers-reduced-motion:reduce) { * {animation:none !important;transition:none !important} #quad-rig,#ball,#stars{opacity:0!important} #sit-rig{opacity:1!important} }
    
        :root{--D:12.4s}
        #sit-rig{opacity:0}
        #quad-rig{animation:pounce-action var(--D) ease-in-out infinite}
        #ball{animation:ball-game var(--D) ease-in-out infinite}
        #q-leg-front-near{animation:pounce-paw var(--D) ease-in-out infinite}
        #q-leg-front-far{animation:pounce-paw-2 var(--D) ease-in-out infinite}
        #stars{animation:star-game var(--D) step-end infinite}
        @keyframes pounce-action{0%,18%,100%{transform:translate(-18px,0)}28%{transform:translate(-12px,8px) scale(1.09,.89)}35%{transform:translate(-16px,11px) scale(1.14,.82)}37%{transform:translate(-10px,-9px) scale(.95,1.08)}40%{transform:translate(53px,-56px) rotate(-7deg)}44%{transform:translate(66px,-32px) rotate(6deg)}48%{transform:translate(77px,7px) scale(1.1,.89)}52%{transform:translate(67px,-6px) scale(.98,1.03)}59%{transform:translate(59px,0)}82%{transform:translate(45px,0)}100%{transform:translate(-18px,0)}}
        @keyframes pounce-paw{0%,28%,66%,100%{transform:rotate(0)}38%,44%{transform:rotate(-40deg)}50%{transform:rotate(25deg)}}
        @keyframes pounce-paw-2{0%,28%,66%,100%{transform:rotate(0)}37%,43%{transform:rotate(29deg)}49%{transform:rotate(-18deg)}}
        @keyframes ball-game{0%,16%,100%{opacity:1;transform:translate(0,0)}25%{transform:translate(-18px,0)}37%{transform:translate(-25px,-4px)}42%{transform:translate(9px,-25px)}50%{transform:translate(65px,-14px)}61%{transform:translate(100px,0)}79%{transform:translate(110px,0)}91%{transform:translate(0,0)}}
        @keyframes star-game{0%,38%,49%,100%{opacity:0}39%,48%{opacity:1}}
        ]]></style>
