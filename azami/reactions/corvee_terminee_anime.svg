<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Corvée terminée" data-scene="corvee_terminee" data-theme-agnostic="true" data-background="transparent" data-duration="4.8" data-loop="false" data-trigger="chore_completed">
      <title>Corvée terminée</title><g id="micro-accents"><g id="spark-a"><path d="M120 276 Q121 284 129 285 Q121 286 120 294 Q119 286 111 285 Q119 284 120 276Z" fill="#F2BC42"/></g><g id="spark-b"><path d="M391 315 Q392 323 400 324 Q392 325 391 333 Q390 325 382 324 Q390 323 391 315Z" fill="#FFF5DD"/></g></g><style><![CDATA[:root{--azami-r:4.8s;}

/* Azami V3 · short reactions, played ONCE on trigger, no background */
:root { --azami-r: 4.5s; }
#cat-rig,#head-rig,#body-rig,#tail,#ear-left,#ear-right,#arm-left,#arm-right,
#scene-prop,#basket-rig,#fish-pop,#broom-rig,#clean-sparkles,#coin-rig,#coin-sparkles,
#envelope-rig,#heart-rig,#eyes-open,#eyes-sleepy,#smile,#meow-mouth,#confetti,
#motion-arcs,#spark-pop,#spark-a,#spark-b,#spark-c,#reward-mark,#reward-medal,#peek-spark,
#reward-rays,#reward-stars,#extra-reward,#nose,#whiskers{ transform-box:view-box; }
#cat-rig{transform-origin:256px 359px;animation:cat-action var(--azami-r) cubic-bezier(.18,.8,.29,1) 1 both;}
#head-rig{transform-origin:256px 242px;animation:head-action var(--azami-r) ease-in-out 1 both;}
#body-rig{transform-origin:256px 359px;animation:breath var(--azami-r) ease-in-out 1 both;}
#tail{transform-origin:321px 340px;animation:tail-action var(--azami-r) ease-in-out 1 both;}
#ear-left{transform-origin:178px 145px;animation:ear-l var(--azami-r) ease-in-out 1 both;}
#ear-right{transform-origin:333px 145px;animation:ear-r var(--azami-r) ease-in-out 1 both;}
#arm-left{transform-origin:205px 308px;animation:paw-l var(--azami-r) ease-in-out 1 both;}
#arm-right{transform-origin:303px 308px;animation:paw-r var(--azami-r) ease-in-out 1 both;}
#eyes-open{animation:eyes-open-anim var(--azami-r) steps(1,end) 1 both;}
#eyes-sleepy{animation:eyes-close-anim var(--azami-r) steps(1,end) 1 both;}
#smile{animation:smile-anim var(--azami-r) steps(1,end) 1 both;}
#meow-mouth{animation:mouth-anim var(--azami-r) steps(1,end) 1 both;}
#spark-a{animation:spark-a var(--azami-r) ease-in-out 1 both;}
#spark-b,#spark-c{animation:spark-b var(--azami-r) ease-in-out 1 both;}
#motion-arcs,#spark-pop{animation:fx var(--azami-r) steps(1,end) 1 both;}
#reward-mark,#reward-medal,#reward-rays,#reward-stars,#peek-spark,#extra-reward{transform-origin:256px 240px;animation:reward-emerge var(--azami-r) ease-out 1 both;}
@keyframes breath{0%,12%,100%{transform:scale(1)} 35%{transform:scale(1.03,.965)} 55%{transform:scale(.985,1.02)}}
@keyframes head-action{0%,10%,80%,100%{transform:rotate(0deg)} 18%{transform:rotate(-9deg)} 30%{transform:rotate(8deg)} 42%{transform:rotate(-5deg)} 58%{transform:rotate(9deg)}}
@keyframes cat-action{0%,100%{transform:translate(0,0)} 18%{transform:translateY(7px) scale(1.07,.93)} 34%{transform:translateY(-38px) rotate(-6deg)} 44%{transform:translateY(1px) scale(1.08,.94)} 55%{transform:translateY(-10px)} 70%{transform:translate(0,0)}}
@keyframes tail-action{0%,100%{transform:rotate(0)} 16%{transform:rotate(-12deg)} 35%{transform:rotate(24deg)} 52%{transform:rotate(-19deg)} 70%{transform:rotate(6deg)}}
@keyframes ear-l{0%,100%{transform:rotate(0)} 19%{transform:rotate(-8deg)} 25%{transform:rotate(7deg)} 37%{transform:rotate(0)}}
@keyframes ear-r{0%,100%{transform:rotate(0)} 25%{transform:rotate(9deg)} 34%{transform:rotate(-5deg)} 42%{transform:rotate(0)}}
@keyframes paw-l{0%,100%{transform:rotate(0)} 29%{transform:rotate(-26deg)} 49%{transform:rotate(12deg)} 61%{transform:rotate(0)}}
@keyframes paw-r{0%,100%{transform:rotate(0)} 32%{transform:rotate(23deg)} 44%{transform:rotate(-12deg)} 58%{transform:rotate(0)}}
@keyframes eyes-open-anim{0%,14%,20%,46%,52%,100%{opacity:1}15%,19%,47%,51%{opacity:0}}
@keyframes eyes-close-anim{0%,14%,20%,46%,52%,100%{opacity:0}15%,19%,47%,51%{opacity:1}}
@keyframes smile-anim{0%,28%,41%,100%{opacity:1}29%,40%{opacity:0}}
@keyframes mouth-anim{0%,28%,41%,100%{opacity:0}29%,40%{opacity:1}}
@keyframes spark-a{0%,12%,100%{opacity:0;transform:scale(.3)}25%,47%{opacity:1;transform:scale(1.18)}65%{opacity:.5;transform:scale(.9)}}
@keyframes spark-b{0%,19%,100%{opacity:0;transform:scale(.25)}32%,58%{opacity:1;transform:scale(1.1)}78%{opacity:.2;transform:scale(.85)}}
@keyframes fx{0%,12%,49%,100%{opacity:0}13%,48%{opacity:1}}
@keyframes reward-emerge{0%,20%,95%,100%{opacity:0;transform:translateY(25px) scale(.35)}34%,72%{opacity:1;transform:translateY(-15px) scale(1.02)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#reward-mark,#reward-medal,#reward-rays,#reward-stars,#peek-spark,#extra-reward{opacity:1!important}}


 #broom-rig{transform-origin:302px 289px;animation:sweep-burst var(--azami-r) cubic-bezier(.3,0,.2,1) 1 both}
 @keyframes sweep-burst{0%,13%,100%{transform:rotate(0deg)}22%{transform:rotate(-16deg)}29%{transform:rotate(21deg)}36%{transform:rotate(-23deg)}42%{transform:rotate(26deg)}55%{transform:rotate(-8deg)}72%{transform:rotate(0deg)}}
 #cat-rig{animation:corvee-jig var(--azami-r) ease-in-out 1 both}
 @keyframes corvee-jig{0%,100%{transform:translate(0,0)}18%{transform:translate(-5px,1px)}30%{transform:translate(9px,-10px) rotate(5deg)}42%{transform:translate(-8px,-4px) rotate(-4deg)}59%{transform:translateY(-18px)}77%{transform:translateY(0)}}
 #clean-sparkles{animation:clean-pop var(--azami-r) ease-out 1 both;transform-origin:393px 370px}
 @keyframes clean-pop{0%,27%,100%{opacity:0;transform:scale(.25)}40%,77%{opacity:1;transform:scale(1.25)}}
 ]]></style><desc>Deux coups de balai nerveux, tourbillon et étoiles de propreté</desc>
