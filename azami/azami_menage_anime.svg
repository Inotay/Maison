<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ménage">
      <title>Ménage</title><desc>Azami sursaute, balaie vivement puis admire son travail. Animation CSS de 13 secondes en boucle. Fond transparent.</desc>
      <style><![CDATA[
      :root { color-scheme: dark; }
      #head-rig, #body-rig, #cat-rig, #tail, #ear-left, #ear-right, #arm-left, #arm-right,
      #broom-rig, #basket-rig, #fish-pop, #fish-rig, #coin-rig, #coin-sparkles,
      #envelope-rig, #heart-rig, #switch-knob, #switch-on, #stars-rig, #clean-sparkles,
      #decor-sparkle-1, #decor-sparkle-2, #decor-heart, #meow-mouth, #smile,
      #eyes-open, #eyes-sleepy { transform-box: view-box; }
      #head-rig { transform-origin: 256px 238px; animation: head-move 13s ease-in-out infinite; }
      #body-rig { transform-origin: 256px 352px; animation: breathe 13s ease-in-out infinite; }
      #cat-rig { transform-origin: 256px 350px; animation: cat-move 13s ease-in-out infinite; }
      #tail { transform-origin: 323px 337px; animation: tail-move 13s ease-in-out infinite; }
      #ear-left { transform-origin: 182px 142px; animation: ear-left-move 13s ease-in-out infinite; }
      #ear-right { transform-origin: 330px 142px; animation: ear-right-move 13s ease-in-out infinite; }
      #arm-left { transform-origin: 208px 295px; animation: paw-left-move 13s ease-in-out infinite; }
      #arm-right { transform-origin: 304px 295px; animation: paw-right-move 13s ease-in-out infinite; }
      #eyes-open { animation: open-eye 9.7s steps(1,end) infinite; }
      #eyes-sleepy { animation: closed-eye 9.7s steps(1,end) infinite; }
      #whiskers { transform-origin: 256px 235px; animation: whisker-twitch 5.3s ease-in-out infinite; }
      #nose { transform-origin: 256px 228px; animation: nose-twitch 7.1s ease-in-out infinite; }
      #decor-sparkle-1 { animation: independent-glimmer 5.7s ease-in-out infinite; }
      #decor-sparkle-2 { animation: independent-glimmer 4.3s ease-in-out infinite reverse; }
      #meow-mouth { animation: meow-face 13s steps(1,end) infinite; }
      #smile { animation: smile-face 13s steps(1,end) infinite; }
      @keyframes breathe {
        0%,12%,22%,34%,52%,68%,79%,100% { transform: scale(1); }
        7%,28%,60%,92% { transform: translateY(2px) scale(1.012,.988); }
        47% { transform: translateY(-3px) scale(1.05,.95); }
      }
      @keyframes open-eye {
        0%,14%,17.5%,38%,41%,73%,75.5%,100% {opacity:1;}
        14.5%,16.2%,38.5%,40.5%,73.5%,75% {opacity:0;}
      }
      @keyframes closed-eye {
        0%,14%,17.5%,38%,41%,73%,75.5%,100% {opacity:0;}
        14.5%,16.2%,38.5%,40.5%,73.5%,75% {opacity:1;}
      }
      @keyframes whisker-twitch {0%,20%,56%,86%,100% {transform:translateX(0);} 21% {transform:translateX(-2px);} 23% {transform:translateX(1px);} 58% {transform:translateX(1.6px);} 60% {transform:translateX(-1px);}}
      @keyframes nose-twitch {0%,38%,65%,100% {transform:translateY(0);} 40% {transform:translateY(2px);} 42% {transform:translateY(-1px);} 66% {transform:translateY(1px);} 69% {transform:translateY(0);}}
      @keyframes independent-glimmer {0%,100% {opacity:.35;} 33% {opacity:.9;} 67% {opacity:.55;}}
      @keyframes meow-face {0%,38%,43%,78%,83%,100% {opacity:0;} 39%,42%,79%,82% {opacity:1;} }
      @keyframes smile-face {0%,38%,43%,78%,83%,100% {opacity:1;} 39%,42%,79%,82% {opacity:0;} }
      @keyframes ear-left-move {0%,22%,28%,56%,60%,100% {transform:rotate(0deg);} 22.6% {transform:rotate(-17deg);} 23.4% {transform:rotate(5deg);} 24% {transform:rotate(-8deg);} 57% {transform:rotate(9deg);} 58.3% {transform:rotate(-5deg);} }
      @keyframes ear-right-move {0%,30%,34%,71%,74%,100% {transform:rotate(0deg);} 30.8% {transform:rotate(13deg);} 31.6% {transform:rotate(-6deg);} 32.5% {transform:rotate(4deg);} 71.8% {transform:rotate(-13deg);} 72.8% {transform:rotate(4deg);} }
      @media (prefers-reduced-motion: reduce) { * {animation: none !important;} }
    
       @keyframes head-move {0%,14%,100%{transform:rotate(0deg);} 17%{transform:rotate(14deg);} 20%{transform:rotate(-5deg);} 23%{transform:rotate(0deg);} 34%{transform:rotate(-9deg);} 38%{transform:rotate(6deg);} 44%{transform:rotate(0deg);} 64%{transform:rotate(-5deg);} 68%{transform:rotate(8deg);} 75%{transform:rotate(0deg);} }
       @keyframes cat-move {0%,13%,100%{transform:translate(0,0) scale(1);} 16%{transform:translate(-4px,-11px) rotate(-4deg);} 19%{transform:translate(2px,1px) scale(1.03,.94);} 23%{transform:translate(0,0);} 33%{transform:translate(7px,-4px) rotate(4deg);} 37%{transform:translate(-7px,1px) rotate(-5deg);} 42%{transform:translate(4px,-3px) rotate(2deg);} 48%{transform:translate(0,0);} 64%{transform:translateY(-21px) scale(.95,1.06);} 68%{transform:translateY(0) scale(1.08,.90);} 72%{transform:translateY(-5px) scale(1,1);} 76%{transform:translate(0,0) scale(1);} }
       @keyframes tail-move {0%,27%,48%,100%{transform:rotate(0deg);} 30%{transform:rotate(22deg);} 34%{transform:rotate(-16deg);} 38%{transform:rotate(11deg);} 42%{transform:rotate(0deg);} 65%{transform:rotate(17deg);} 72%{transform:rotate(-6deg);} }
       @keyframes paw-left-move {0%,32%,50%,100%{transform:rotate(0deg);} 35%{transform:translate(7px,4px) rotate(17deg);} 39%{transform:translate(-5px,-4px) rotate(-10deg);} 44%{transform:translate(7px,4px) rotate(17deg);} }
       @keyframes paw-right-move {0%,32%,50%,100%{transform:rotate(0deg);} 35%{transform:translate(-5px,-4px) rotate(-13deg);} 39%{transform:translate(8px,4px) rotate(15deg);} 44%{transform:translate(-5px,-4px) rotate(-13deg);} }
       #broom-rig {transform-origin: 304px 287px; animation: brush 13s cubic-bezier(.22,.8,.3,1) infinite;}
       #clean-sparkles {animation: cleanup 13s ease-in-out infinite;}
       @keyframes brush {0%,27%,50%,100%{transform:rotate(0deg);} 29%{transform:rotate(-20deg);} 33%{transform:rotate(22deg);} 36%{transform:rotate(-18deg);} 39%{transform:rotate(20deg);} 42%{transform:rotate(-8deg);} 46%{transform:rotate(0deg);} }
       @keyframes cleanup {0%,43%,50%,100%{opacity:0;} 46%,48%,69%,78%{opacity:1;} }
    ]]></style>
