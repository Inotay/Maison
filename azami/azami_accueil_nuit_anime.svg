<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Accueil · bonne nuit">
      <title>Accueil · bonne nuit</title><desc>Azami se réveille, miaule, joue et se rendort. Animation CSS de 16 secondes en boucle. Fond transparent.</desc>
      <style><![CDATA[
      :root { color-scheme: dark; }
      #head-rig, #body-rig, #cat-rig, #tail, #ear-left, #ear-right, #arm-left, #arm-right,
      #broom-rig, #basket-rig, #fish-pop, #fish-rig, #coin-rig, #coin-sparkles,
      #envelope-rig, #heart-rig, #switch-knob, #switch-on, #stars-rig, #clean-sparkles,
      #decor-sparkle-1, #decor-sparkle-2, #decor-heart, #meow-mouth, #smile,
      #eyes-open, #eyes-sleepy { transform-box: view-box; }
      #head-rig { transform-origin: 256px 238px; animation: head-move 16s ease-in-out infinite; }
      #body-rig { transform-origin: 256px 352px; animation: breathe 16s ease-in-out infinite; }
      #cat-rig { transform-origin: 256px 350px; animation: cat-move 16s ease-in-out infinite; }
      #tail { transform-origin: 323px 337px; animation: tail-move 16s ease-in-out infinite; }
      #ear-left { transform-origin: 182px 142px; animation: ear-left-move 16s ease-in-out infinite; }
      #ear-right { transform-origin: 330px 142px; animation: ear-right-move 16s ease-in-out infinite; }
      #arm-left { transform-origin: 208px 295px; animation: paw-left-move 16s ease-in-out infinite; }
      #arm-right { transform-origin: 304px 295px; animation: paw-right-move 16s ease-in-out infinite; }
      #eyes-open { animation: open-eye 9.7s steps(1,end) infinite; }
      #eyes-sleepy { animation: closed-eye 9.7s steps(1,end) infinite; }
      #whiskers { transform-origin: 256px 235px; animation: whisker-twitch 5.3s ease-in-out infinite; }
      #nose { transform-origin: 256px 228px; animation: nose-twitch 7.1s ease-in-out infinite; }
      #decor-sparkle-1 { animation: independent-glimmer 5.7s ease-in-out infinite; }
      #decor-sparkle-2 { animation: independent-glimmer 4.3s ease-in-out infinite reverse; }
      #meow-mouth { animation: meow-face 16s steps(1,end) infinite; }
      #smile { animation: smile-face 16s steps(1,end) infinite; }
      @keyframes breathe {
        0%,12%,22%,34%,52%,68%,79%,100% { transform: scale(1); }
        7%,28%,60%,92% { transform: translateY(2px) scale(1.012,.988); }
        47% { transform: translateY(-3px) scale(1.05,.95); }
      }
      @keyframes open-eye {
        0%,14%,17.5%,38%,41%,73%,75.5%,100% {opacity:1;}
        14.5%,16.2%,38.5%,40.5%,73.5%,75% {opacity:0;}
      }
      @keyframes closed-eye {
        0%,14%,17.5%,38%,41%,73%,75.5%,100% {opacity:0;}
        14.5%,16.2%,38.5%,40.5%,73.5%,75% {opacity:1;}
      }
      @keyframes whisker-twitch {0%,20%,56%,86%,100% {transform:translateX(0);} 21% {transform:translateX(-2px);} 23% {transform:translateX(1px);} 58% {transform:translateX(1.6px);} 60% {transform:translateX(-1px);}}
      @keyframes nose-twitch {0%,38%,65%,100% {transform:translateY(0);} 40% {transform:translateY(2px);} 42% {transform:translateY(-1px);} 66% {transform:translateY(1px);} 69% {transform:translateY(0);}}
      @keyframes independent-glimmer {0%,100% {opacity:.35;} 33% {opacity:.9;} 67% {opacity:.55;}}
      @keyframes meow-face {0%,38%,43%,78%,83%,100% {opacity:0;} 39%,42%,79%,82% {opacity:1;} }
      @keyframes smile-face {0%,38%,43%,78%,83%,100% {opacity:1;} 39%,42%,79%,82% {opacity:0;} }
      @keyframes ear-left-move {0%,22%,28%,56%,60%,100% {transform:rotate(0deg);} 22.6% {transform:rotate(-17deg);} 23.4% {transform:rotate(5deg);} 24% {transform:rotate(-8deg);} 57% {transform:rotate(9deg);} 58.3% {transform:rotate(-5deg);} }
      @keyframes ear-right-move {0%,30%,34%,71%,74%,100% {transform:rotate(0deg);} 30.8% {transform:rotate(13deg);} 31.6% {transform:rotate(-6deg);} 32.5% {transform:rotate(4deg);} 71.8% {transform:rotate(-13deg);} 72.8% {transform:rotate(4deg);} }
      @media (prefers-reduced-motion: reduce) { * {animation: none !important;} }
    
       @keyframes head-move {0%,15%,100%{transform:rotate(0deg);} 17%{transform:rotate(-5deg);} 19%{transform:rotate(3deg);} 22%{transform:rotate(0deg);} 36%{transform:rotate(13deg);} 40%{transform:rotate(-7deg);} 44%{transform:rotate(0deg);} 63%{transform:rotate(-10deg);} 69%{transform:rotate(-8deg);} 79%{transform:rotate(0deg);} }
       @keyframes cat-move {0%,33%,100%{transform:translate(0,0) scale(1);} 35%{transform:translateY(-11px) scale(.98,1.04);} 37%{transform:translateY(-19px) scale(1,1.01);} 39%{transform:translateY(0) scale(1.06,.90);} 41%{transform:translateY(-3px) scale(.98,1.02);} 44%{transform:translate(0,0) scale(1);} }
       @keyframes tail-move {0%,22%,48%,70%,100%{transform:rotate(0deg);} 24%{transform:rotate(-9deg);} 37%{transform:rotate(20deg);} 40%{transform:rotate(-16deg);} 64%{transform:rotate(9deg);} 82%{transform:rotate(-12deg);} }
       @keyframes paw-left-move {0%,34%,48%,100%{transform:rotate(0deg);} 35%{transform:translate(6px,-11px) rotate(-30deg);} 38%{transform:translate(12px,-12px) rotate(-40deg);} 40%{transform:translate(5px,-6px) rotate(-18deg);} 43%{transform:rotate(0deg);} }
       @keyframes paw-right-move {0%,56%,100%{transform:rotate(0deg);} 60%{transform:translate(-4px,-8px) rotate(13deg);} 64%{transform:translate(-7px,-8px) rotate(-14deg);} 72%{transform:rotate(0deg);} }
       #fish-rig { transform-origin: 336px 372px; animation: fish-flick 16s ease-in-out infinite; }
       #stars-rig { animation: stars-flick 16s ease-in-out infinite; }
       @keyframes fish-flick {0%,26%,42%,100%{transform:translateY(0) rotate(0deg);} 29%{transform:translateY(-13px) rotate(-18deg);} 32%{transform:translateY(-3px) rotate(12deg);} 35%{transform:translateY(-8px) rotate(-8deg);} 38%{transform:translateY(0) rotate(0deg);} }
       @keyframes stars-flick {0%,50%,85%,100%{opacity:.12;} 55%,72%{opacity:1;} }
    ]]></style>
