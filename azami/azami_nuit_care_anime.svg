<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nuit · Care">
      <title>Nuit · Care</title><desc>Azami lit et serre un petit message affectueux. Animation CSS de 18 secondes en boucle. Fond transparent.</desc>
      <style><![CDATA[
      :root { color-scheme: dark; }
      #head-rig, #body-rig, #cat-rig, #tail, #ear-left, #ear-right, #arm-left, #arm-right,
      #broom-rig, #basket-rig, #fish-pop, #fish-rig, #coin-rig, #coin-sparkles,
      #envelope-rig, #heart-rig, #switch-knob, #switch-on, #stars-rig, #clean-sparkles,
      #decor-sparkle-1, #decor-sparkle-2, #decor-heart, #meow-mouth, #smile,
      #eyes-open, #eyes-sleepy { transform-box: view-box; }
      #head-rig { transform-origin: 256px 238px; animation: head-move 18s ease-in-out infinite; }
      #body-rig { transform-origin: 256px 352px; animation: breathe 18s ease-in-out infinite; }
      #cat-rig { transform-origin: 256px 350px; animation: cat-move 18s ease-in-out infinite; }
      #tail { transform-origin: 323px 337px; animation: tail-move 18s ease-in-out infinite; }
      #ear-left { transform-origin: 182px 142px; animation: ear-left-move 18s ease-in-out infinite; }
      #ear-right { transform-origin: 330px 142px; animation: ear-right-move 18s ease-in-out infinite; }
      #arm-left { transform-origin: 208px 295px; animation: paw-left-move 18s ease-in-out infinite; }
      #arm-right { transform-origin: 304px 295px; animation: paw-right-move 18s ease-in-out infinite; }
      #eyes-open { animation: open-eye 9.7s steps(1,end) infinite; }
      #eyes-sleepy { animation: closed-eye 9.7s steps(1,end) infinite; }
      #whiskers { transform-origin: 256px 235px; animation: whisker-twitch 5.3s ease-in-out infinite; }
      #nose { transform-origin: 256px 228px; animation: nose-twitch 7.1s ease-in-out infinite; }
      #decor-sparkle-1 { animation: independent-glimmer 5.7s ease-in-out infinite; }
      #decor-sparkle-2 { animation: independent-glimmer 4.3s ease-in-out infinite reverse; }
      #meow-mouth { animation: meow-face 18s steps(1,end) infinite; }
      #smile { animation: smile-face 18s steps(1,end) infinite; }
      @keyframes breathe {
        0%,12%,22%,34%,52%,68%,79%,100% { transform: scale(1); }
        7%,28%,60%,92% { transform: translateY(2px) scale(1.012,.988); }
        47% { transform: translateY(-3px) scale(1.05,.95); }
      }
      @keyframes open-eye {
        0%,14%,17.5%,38%,41%,73%,75.5%,100% {opacity:1;}
        14.5%,16.2%,38.5%,40.5%,73.5%,75% {opacity:0;}
      }
      @keyframes closed-eye {
        0%,14%,17.5%,38%,41%,73%,75.5%,100% {opacity:0;}
        14.5%,16.2%,38.5%,40.5%,73.5%,75% {opacity:1;}
      }
      @keyframes whisker-twitch {0%,20%,56%,86%,100% {transform:translateX(0);} 21% {transform:translateX(-2px);} 23% {transform:translateX(1px);} 58% {transform:translateX(1.6px);} 60% {transform:translateX(-1px);}}
      @keyframes nose-twitch {0%,38%,65%,100% {transform:translateY(0);} 40% {transform:translateY(2px);} 42% {transform:translateY(-1px);} 66% {transform:translateY(1px);} 69% {transform:translateY(0);}}
      @keyframes independent-glimmer {0%,100% {opacity:.35;} 33% {opacity:.9;} 67% {opacity:.55;}}
      @keyframes meow-face {0%,38%,43%,78%,83%,100% {opacity:0;} 39%,42%,79%,82% {opacity:1;} }
      @keyframes smile-face {0%,38%,43%,78%,83%,100% {opacity:1;} 39%,42%,79%,82% {opacity:0;} }
      @keyframes ear-left-move {0%,22%,28%,56%,60%,100% {transform:rotate(0deg);} 22.6% {transform:rotate(-17deg);} 23.4% {transform:rotate(5deg);} 24% {transform:rotate(-8deg);} 57% {transform:rotate(9deg);} 58.3% {transform:rotate(-5deg);} }
      @keyframes ear-right-move {0%,30%,34%,71%,74%,100% {transform:rotate(0deg);} 30.8% {transform:rotate(13deg);} 31.6% {transform:rotate(-6deg);} 32.5% {transform:rotate(4deg);} 71.8% {transform:rotate(-13deg);} 72.8% {transform:rotate(4deg);} }
      @media (prefers-reduced-motion: reduce) { * {animation: none !important;} }
    
       @keyframes head-move {0%,22%,100%{transform:rotate(0deg);} 24%{transform:rotate(9deg);} 30%{transform:rotate(12deg);} 34%{transform:rotate(0deg);} 63%{transform:rotate(-12deg);} 69%{transform:rotate(-6deg);} 75%{transform:rotate(0deg);} }
       @keyframes cat-move {0%,44%,100%{transform:translateY(0) scale(1);} 49%{transform:translateY(-10px) scale(.97,1.06);} 53%{transform:translateY(-7px) rotate(-3deg);} 60%{transform:translate(0,0) scale(1);} }
       @keyframes tail-move {0%,28%,100%{transform:rotate(0deg);} 30%{transform:rotate(14deg);} 44%{transform:rotate(-11deg);} 65%{transform:rotate(14deg);} 79%{transform:rotate(0deg);} }
       @keyframes paw-left-move {0%,34%,64%,100%{transform:rotate(0deg);} 37%{transform:translate(9px,-9px) rotate(-16deg);} 44%{transform:translate(0,-12px) rotate(4deg);} 53%{transform:translate(10px,-15px) rotate(-12deg);} }
       @keyframes paw-right-move {0%,34%,64%,100%{transform:rotate(0deg);} 38%{transform:translate(-8px,-9px) rotate(17deg);} 48%{transform:translate(0,-15px) rotate(-8deg);} 53%{transform:translate(-10px,-18px) rotate(14deg);} }
       #envelope-rig {transform-origin: 256px 388px; animation: letter 18s ease-in-out infinite;}
       #heart-rig {animation: hearts 18s ease-in-out infinite;}
       @keyframes letter {0%,20%,100%{transform:translate(0,0) rotate(0deg);} 24%{transform:translate(0,-6px) rotate(-5deg);} 32%{transform:translate(0,0) rotate(0deg);} 45%{transform:translate(0,-21px) rotate(4deg);} 52%{transform:translate(0,-27px) rotate(-4deg);} 60%{transform:translate(0,0) rotate(0deg);} }
       @keyframes hearts {0%,38%,72%,100%{opacity:0; transform:translateY(17px) scale(.7);} 43%{opacity:1; transform:translateY(6px) scale(1);} 50%{transform:translateY(-24px) scale(1.15);} 63%{opacity:.8; transform:translateY(-40px) scale(1);} }
    ]]></style>
